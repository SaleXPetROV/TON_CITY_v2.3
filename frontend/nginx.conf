server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # security headers (the Mini App may be framed only by Telegram)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content-Security-Policy (scripts by hash, no 'unsafe-inline') — generated at build time
    include /etc/nginx/snippets/csp.conf;
    # enable when the site is served over HTTPS (TLS at this nginx or at the proxy in front):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # compression for the SPA bundle, JSON and SVG (images are already compressed)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # API + WebSocket -> backend container
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /ws {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # hashed assets: cache for a long time
    location /static/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    # building sprites, fonts: rarely change — cache for a week
    location ~* ^/(sprites|fonts)/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # single-page app: every other path -> index.html
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        # nginx drops the server-level headers when a location adds its own: repeat them for the page
        include /etc/nginx/snippets/csp.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
