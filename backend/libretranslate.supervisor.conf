; Персистентная копия. Установка supervisor-программы LibreTranslate:
;   sudo cp /app/backend/libretranslate.supervisor.conf /etc/supervisor/conf.d/libretranslate.conf
;   sudo supervisorctl reread && sudo supervisorctl update
[program:libretranslate]
command=/root/lt-venv/bin/libretranslate --host 127.0.0.1 --port 5000 --load-only en,ru,es,zh,fr,de,ja,ko,id --disable-files-translation
directory=/root
autostart=true
autorestart=true
startsecs=20
startretries=3
stopwaitsecs=20
environment=HOME="/root",ARGOS_PACKAGES_DIR="/root/.local/share/argos-translate/packages"
stderr_logfile=/var/log/supervisor/libretranslate.err.log
stdout_logfile=/var/log/supervisor/libretranslate.out.log
