; ============================================================================
; GRAM City — Independent Telegram Bot Webhook Server (separate process)
; ============================================================================
; server.py (API) only forwards Telegram updates to this process, which runs
; ALL bot logic on its own event loop / sockets / DB pool.
;
; Install on your server:
;     sudo cp /app/backend/telegram_bot.supervisor.conf \
;             /etc/supervisor/conf.d/telegram_bot.conf
;     sudo supervisorctl reread
;     sudo supervisorctl update
;     sudo supervisorctl start telegram_bot
;
; Keeps running (autostart + autorestart) until you stop it:
;     sudo supervisorctl stop telegram_bot
; ============================================================================

[program:telegram_bot]
command=/root/.venv/bin/uvicorn bot_webhook_server:app --host 127.0.0.1 --port 8002 --workers 1
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
; MONGO_URL / DB_NAME are read from /app/backend/.env automatically.
; TELEGRAM_BOT_TOKEN is read from the database (set it in the admin panel).
stderr_logfile=/var/log/supervisor/telegram_bot.err.log
stdout_logfile=/var/log/supervisor/telegram_bot.out.log
