<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts_local.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#030304;font-family:Rajdhani,sans-serif;color:#fff}
#bg{position:absolute;inset:0}
#cam{position:absolute;inset:0;transform-origin:540px 960px}
.scene{position:absolute;inset:0;opacity:0}
.cap{position:absolute;left:40px;right:40px;top:150px;text-align:center}
.title{position:relative;font-family:Unbounded,sans-serif;font-weight:900;font-size:84px;line-height:1.02;text-transform:uppercase;letter-spacing:1px}
.title .l{position:absolute;inset:0;mix-blend-mode:screen}
.title .r{color:#ff2d75}.title .c{color:#00F0FF}.title .m{position:relative;color:#fff;text-shadow:0 0 30px rgba(0,240,255,.5)}
.title b{color:#FFD84D;text-shadow:0 0 30px rgba(255,216,77,.6)}
.sub{margin-top:18px;font-size:46px;font-weight:700;color:#d6f3ff}
.phoneWrap{position:absolute;left:210px;top:470px;width:660px;height:1428px;perspective:1600px}
.phone{position:absolute;inset:0;border-radius:66px;overflow:hidden;border:4px solid #00F0FF;background:#000}
.phone img{position:absolute;left:0;top:0;width:660px;height:1428px}
.ring{position:absolute;width:130px;height:130px;margin:-65px 0 0 -65px;border-radius:50%;border:6px solid #FFD84D;box-shadow:0 0 34px #FFD84D;opacity:0}
.tag{position:absolute;padding:12px 26px;border-radius:999px;background:#FFD84D;color:#111;font-family:Unbounded;font-weight:900;font-size:30px;white-space:nowrap;opacity:0;box-shadow:0 10px 34px rgba(255,216,77,.5)}
.logo{position:absolute;left:0;right:0;text-align:center;font-family:Unbounded;font-weight:900;font-size:112px;white-space:nowrap;color:#fff;text-shadow:0 0 30px #00F0FF,0 0 90px rgba(0,240,255,.7)}
.line{position:absolute;left:30px;right:30px;text-align:center;font-family:Unbounded;font-weight:900;font-size:58px;color:#FFD84D;text-shadow:0 0 26px rgba(255,216,77,.6);white-space:nowrap}
.cta{position:absolute;left:50%;padding:34px 74px;border-radius:999px;font-family:Unbounded;font-weight:900;font-size:50px;color:#031018;background:linear-gradient(90deg,#00F0FF,#8afcff);box-shadow:0 0 60px rgba(0,240,255,.7);white-space:nowrap}
.small{position:absolute;left:0;right:0;text-align:center;font-size:42px;font-weight:700;color:#9fc3d4}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.mont{position:absolute;left:210px;top:470px;width:660px;height:1428px;border-radius:66px;overflow:hidden;border:4px solid #FFD84D;opacity:0}
.mont img{width:660px;height:1428px}
#build .ch{display:inline-block}
</style></head><body>
<canvas id="bg" width="1080" height="1920"></canvas>
<div id="cam"><div id="root"></div></div>
<div id="vign"></div><div id="flash"></div>
<script>
const BPM=128, B=60/BPM, BAR=4*B, DROP=2*BAR;
const W=660, H=1428, S=W/1170, PX=210, PY=470;
const T=(bar)=>DROP+bar*BAR;            // start of drop bar n
const SC=[
 {id:'s0', a:T(1), b:T(2), img:'shots/biz_crazy.png', t:'Запускай<br><b>смены</b>', s:'Бизнес производит ресурсы', zoom:[1.0,1.08], focus:[585,1600], tilt:-4,
  calls:[{x:585,y:2226,at:.25,tag:'Смена идёт'},{x:300,y:2040,at:1.0,tag:'+ресурсы/час'}]},
 {id:'s1', a:T(2), b:T(4), img:'shots/biz_std.png', img2:'shots/biz_crazy.png', swap:T(3)-T(2), t:'Меняй<br><b>скины</b>', s:'Уникальный облик зданий', zoom:[1.55,1.75], focus:[585,986], tilt:3,
  calls:[]},
 {id:'s2', a:T(4), b:T(5), img:'shots/resources.png', t:'Копи<br><b>ресурсы</b>', s:'21 вид сырья и товаров', zoom:[1.0,1.1], focus:[585,1047], tilt:-3,
  calls:[{x:588,y:1047,at:.3,tag:'Твой склад'}]},
 {id:'s3', a:T(5), b:T(6), img:'shots/boosters.png', t:'Включай<br><b>усилители</b>', s:'Автозапуск смен и защита склада', zoom:[1.0,1.1], focus:[585,800], tilt:4,
  calls:[{x:585,y:666,at:.3,tag:'Работает само'}]},
 {id:'s4', a:T(6), b:T(7), img:'shots/trading.png', t:'Торгуй<br><b>с игроками</b>', s:'Живой рынок ресурсов', zoom:[1.0,1.1], focus:[585,1100], tilt:-4,
  calls:[{x:582,y:945,at:.3,tag:'Покупай и продавай'}]},
 {id:'s5', a:T(7), b:T(8), img:'shots/tasks.png', t:'Забирай<br><b>награды</b>', s:'Задания каждый день', zoom:[1.0,1.1], focus:[585,1150], tilt:3,
  calls:[{x:891,y:1191,at:.3,tag:'Забрать'}]},
 {id:'s6', a:T(8), b:T(9), img:'shots/league.png', t:'Рвись<br><b>в лигах</b>', s:'От Бронзы до Алмаза', zoom:[1.0,1.1], focus:[585,1250], tilt:-3,
  calls:[{x:579,y:1206,at:.3,tag:'Ты — #2'}]},
 {id:'s7', a:T(9), b:T(10), img:'shots/pass.png', img2:'shots/pass_scroll.png', swap:2*B, t:'Проходи<br><b>City Pass</b>', s:'30 уровней наград', zoom:[1.0,1.08], focus:[585,900], tilt:4,
  calls:[{x:585,y:570,at:.25,until:2*B-.05,tag:'Забрать всё'},{x:891,y:972,at:2*B+.1,tag:'Премиум'}]},
];
const MONT=['biz_crazy','resources','boosters','trading','tasks','league','pass','biz_std'];
const root=document.getElementById('root'), H_=[];
H_.push('<div class="scene" id="build"><div class="logo" id="blogo" style="top:780px"></div></div>');
H_.push('<div class="scene" id="hit"><div class="logo" id="hlogo" style="top:700px">GRAM CITY</div><div class="line" id="hline" style="top:900px">Строй. Торгуй. Побеждай.</div></div>');
for(const s of SC){
  const title='<span class="l r">'+s.t+'</span><span class="l c">'+s.t+'</span><span class="m">'+s.t+'</span>';
  H_.push('<div class="scene" id="'+s.id+'"><div class="cap"><div class="title">'+title+'</div><div class="sub">'+s.s+'</div></div>'+
   '<div class="phoneWrap"><div class="phone"><img id="'+s.id+'-i1" src="'+s.img+'">'+(s.img2?'<img id="'+s.id+'-i2" src="'+s.img2+'" style="opacity:0">':'')+'</div></div>'+
   s.calls.map((c,k)=>'<div class="ring" id="'+s.id+'-r'+k+'"></div><div class="tag" id="'+s.id+'-t'+k+'">'+c.tag+'</div>').join('')+'</div>');
}
H_.push('<div class="scene" id="mont"><div class="cap"><div class="title"><span class="m">Твой город<br><b>ждёт</b></span></div></div>'+MONT.map((m,i)=>'<div class="mont" id="m'+i+'"><img src="shots/'+m+'.png"></div>').join('')+'</div>');
H_.push('<div class="scene" id="outro"><div class="logo" id="ologo" style="top:640px">GRAM CITY</div><div class="small" id="osub" style="top:840px">Экономическая стратегия на TON</div>'+
  '<div class="cta" id="octa" style="top:1010px">Играй в Telegram</div></div>');
root.innerHTML=H_.join('');

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>1-Math.pow(1-clamp(x),3), back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function rnd(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}
// beat helpers
const CUTS=[DROP, ...SC.map(s=>s.a).slice(1), T(10), T(11)];          // strong hits
function sinceHit(t){let best=99;for(const c of CUTS){if(t>=c)best=Math.min(best,t-c);}return best;}
function beatPhase(t){return t<DROP?((t)/B)%1:((t-DROP)/B)%1;}

// background
const bg=document.getElementById('bg').getContext('2d');
const PU=[[.08,.22,30,.5,7,0,'#00F0FF'],[.62,.78,-30,.42,8,1.3,'#9B5CFF'],[.30,.58,-30,.46,7.5,2.7,'#0098EA'],[.78,.18,150,.44,8.5,.6,'#00F0FF'],
 [.14,.84,-30,.54,9,4,'#00F0FF'],[.88,.60,-150,.48,7.7,2.1,'#9B5CFF'],[.45,.12,30,.40,6.6,5,'#0098EA'],[.54,.40,150,.38,8.2,3.3,'#00F0FF'],
 [.2,.35,30,.5,6.8,1.7,'#FFD84D'],[.7,.9,-30,.45,7.2,4.4,'#00F0FF']];
function drawBg(t){
  const drop=t>=DROP, bp=drop?Math.exp(-beatPhase(t)*5):0;
  bg.fillStyle='#030304';bg.fillRect(0,0,1080,1920);
  let g=bg.createRadialGradient(540,-100,0,540,-100,1600);g.addColorStop(0,'rgba(0,152,234,'+(.16+.10*bp)+')');g.addColorStop(1,'rgba(3,3,4,0)');bg.fillStyle=g;bg.fillRect(0,0,1080,1920);
  g=bg.createRadialGradient(900,2050,0,900,2050,1300);g.addColorStop(0,'rgba(112,0,255,'+(.15+.10*bp)+')');g.addColorStop(1,'rgba(3,3,4,0)');bg.fillStyle=g;bg.fillRect(0,0,1080,1920);
  bg.save();bg.strokeStyle='rgba(0,240,255,'+(.06+.10*bp)+')';bg.lineWidth=2;const st=96,tn=Math.tan(Math.PI/6),off=(t*(drop?60:18))%st;
  for(let c=-3000;c<4000;c+=st){bg.beginPath();bg.moveTo(0,c+off);bg.lineTo(1080,c+off+1080*tn);bg.stroke();bg.beginPath();bg.moveTo(0,c-off);bg.lineTo(1080,c-off-1080*tn);bg.stroke();}
  bg.restore();
  const sp=drop?2.2:1;
  for(const [x,y,ang,d,dur,dl,col] of PU){
    const ph=((t*sp+dl)%dur)/dur, op=ph<.12?ph/.12:ph>.85?(1-ph)/.15:1, dist=ph*d*1080, a=ang*Math.PI/180, len=drop?260:150;
    const hx=x*1080+Math.cos(a)*dist, hy=y*1920+Math.sin(a)*dist;
    bg.save();bg.globalAlpha=op;const gr=bg.createLinearGradient(hx-Math.cos(a)*len,hy-Math.sin(a)*len,hx,hy);
    gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,col);bg.strokeStyle=gr;bg.lineWidth=5;bg.beginPath();
    bg.moveTo(hx-Math.cos(a)*len,hy-Math.sin(a)*len);bg.lineTo(hx,hy);bg.stroke();bg.shadowColor=col;bg.shadowBlur=28;bg.fillStyle=col;bg.beginPath();bg.arc(hx,hy,9,0,7);bg.fill();bg.restore();
  }
}
function show(id,a,b,t){const e=document.getElementById(id);const on=t>=a&&t<b;e.style.opacity=on?1:0;return on;}
const cam=document.getElementById('cam'), flash=document.getElementById('flash');
window.render=function(t){
  drawBg(t);
  const h=sinceHit(t);
  // camera: punch + shake on every hit, small bump every beat in the drop
  const shake=h<.3?(1-h/.3)*16:0, bump=(t>=DROP&&t<T(10.5))?Math.exp(-beatPhase(t)*6)*.012:0;
  cam.style.transform='translate('+((rnd(Math.floor(t*30))-.5)*shake)+'px,'+((rnd(Math.floor(t*30)+9)-.5)*shake)+'px) scale('+(1+bump+(h<.25?(1-h/.25)*.06:0))+')';
  flash.style.opacity=h<.16?(1-h/.16)*.75:0;
  // BUILD 0..DROP: letters appear one by one on beats, glitching
  if(show('build',0,DROP,t)){
    const txt='GRAM CITY', n=Math.min(txt.length,Math.floor(t/(DROP/txt.length))+1), el=document.getElementById('blogo');
    el.innerHTML=txt.slice(0,n).split('').map((ch,i)=>'<span class="ch" style="opacity:'+(i===n-1?(.4+.6*rnd(Math.floor(t*30))):1)+'">'+(ch===' '?'&nbsp;':ch)+'</span>').join('');
    el.style.transform='scale('+(.9+.1*t/DROP)+')'; el.style.filter='blur('+(2*(1-t/DROP))+'px)';
  }
  // HIT logo on the drop
  if(show('hit',DROP,T(1),t)){
    const lt=t-DROP; document.getElementById('hlogo').style.transform='scale('+(2.2-1.2*back(lt/.35))+')';
    const hl=document.getElementById('hline'); hl.style.opacity=ease((lt-.25)/.25); hl.style.transform='translateY('+(40*(1-ease((lt-.25)/.25)))+'px)';
  }
  for(const s of SC){
    if(!show(s.id,s.a,s.b,t)) continue;
    const lt=t-s.a, dur=s.b-s.a, k=clamp(lt/dur);
    // title slam + RGB split
    const tt=document.querySelector('#'+s.id+' .title'); tt.style.transform='scale('+(1.7-0.7*back(lt/.22))+')'; tt.style.filter='blur('+Math.max(0,6*(1-lt/.15))+'px)';
    const sp=Math.max(0,12*(1-lt/.35));
    tt.querySelector('.r').style.transform='translate('+(-sp)+'px,0)'; tt.querySelector('.c').style.transform='translate('+sp+'px,0)';
    tt.querySelector('.r').style.opacity=tt.querySelector('.c').style.opacity=sp>0.5?.85:0;
    const sb=document.querySelector('#'+s.id+' .sub'); sb.style.opacity=ease((lt-.15)/.2); sb.style.transform='translateY('+(30*(1-ease((lt-.15)/.2)))+'px)';
    // phone: slide in + tilt + beat glow
    const pw=document.querySelector('#'+s.id+' .phoneWrap'), ph=document.querySelector('#'+s.id+' .phone');
    const enter=ease(lt/.3);
    pw.style.transform='translateY('+(260*(1-enter))+'px) rotate('+(s.tilt*(1-0.4*k))+'deg)';
    const gl=Math.exp(-beatPhase(t)*5);
    ph.style.boxShadow='0 0 '+(40+60*gl)+'px rgba(0,240,255,'+(.35+.45*gl)+'),0 40px 140px rgba(0,0,0,.8)';
    const z=s.zoom[0]+(s.zoom[1]-s.zoom[0])*k, fx=s.focus[0]*S, fy=s.focus[1]*S;
    for(const n of ['i1','i2']){const im=document.getElementById(s.id+'-'+n); if(!im) continue; im.style.transformOrigin=fx+'px '+fy+'px'; im.style.transform='scale('+z+')';}
    if(s.img2){ const sw=clamp((lt-s.swap)/.06); const i1=document.getElementById(s.id+'-i1'), i2=document.getElementById(s.id+'-i2');
      i1.style.opacity=1-sw; i2.style.opacity=sw;
      if(s.id==='s7'){i1.style.transform='translateY('+(-90*sw)+'px) scale('+z+')'; i2.style.transform='translateY('+(90*(1-sw))+'px) scale('+z+')';}
      if(s.id==='s1'){const pop=lt>=s.swap?Math.exp(-(lt-s.swap)*7):0; i2.style.transform='scale('+(z*(1+0.12*pop))+')'; i2.style.filter='brightness('+(1+1.4*pop)+') saturate('+(1+pop)+')';}
    }
    s.calls.forEach((c,i)=>{const r=document.getElementById(s.id+'-r'+i), tg=document.getElementById(s.id+'-t'+i);
      const cx=PX+fx+(c.x*S-fx)*z, cy=PY+fy+(c.y*S-fy)*z, lc=lt-c.at, on=clamp(lc/.15)*clamp(((c.until||dur)-lt-.05)/.12);
      const pul=Math.exp(-beatPhase(t)*4); r.style.left=cx+'px'; r.style.top=cy+'px'; r.style.opacity=lc>0?on:0; r.style.transform='scale('+(0.8+0.35*pul)+')';
      tg.style.opacity=lc>0?on:0; const right=cx>540; tg.style.left=(right?cx-90-tg.offsetWidth:cx+90)+'px';
      tg.style.top=(cy-32)+'px'; tg.style.transform='scale('+(lc>0?(1.4-0.4*back(lc/.2)):1)+')';});
  }
  // MONTAGE (fill bar): screens flicker on 8th notes
  if(show('mont',T(10),T(11),t)){
    const lt=t-T(10), idx=Math.floor(lt/(B/2));
    MONT.forEach((m,i)=>{const e=document.getElementById('m'+i); const on=i===idx%MONT.length;
      e.style.opacity=on?1:0; e.style.transform='rotate('+((i%2?1:-1)*5)+'deg) scale('+(1.06-0.06*ease(((lt%(B/2))/(B/2))))+')';});
    const tt=document.querySelector('#mont .title'); tt.style.transform='scale('+(1+.05*Math.sin(lt*20))+')';
  }
  // OUTRO
  if(show('outro',T(11),99,t)){
    const lt=t-T(11);
    document.getElementById('ologo').style.transform='scale('+(2.0-1.0*back(lt/.35))+')';
    const os=document.getElementById('osub'); os.style.opacity=ease((lt-.3)/.3);
    const c=document.getElementById('octa'); c.style.opacity=ease((lt-.55)/.3);
    c.style.transform='translateX(-50%) scale('+((lt>.55?(1.3-0.3*back((lt-.55)/.3)):1)*(1+.05*Math.exp(-beatPhase(t)*5)*(t<T(13)?1:0)))+')';
  }
};
window.render(0);
</script></body></html>
